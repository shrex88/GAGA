services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: traceflow
      POSTGRES_PASSWORD: traceflow_pass
      POSTGRES_DB: traceflow_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceflow -d traceflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.23-community
    environment:
      NEO4J_AUTH: neo4j/traceflow_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://traceflow:traceflow_pass@postgres:5432/traceflow_db
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: traceflow_neo4j
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: replace-with-secure-secret-key-in-production
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pg_data:
  neo4j_data:
